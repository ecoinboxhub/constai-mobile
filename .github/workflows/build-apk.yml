name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Patch jcenter() references in native modules
        run: |
          find node_modules -name "build.gradle" -exec grep -l 'jcenter()' {} \; | while read f; do
            echo "Patching $f"
            sed -i 's/jcenter()/mavenCentral()/g' "$f"
          done

      - run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Find APK
        run: |
          APK=$(find android -name "*.apk" -type f | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK)" >> $GITHUB_OUTPUT
          echo "APK size: $(stat -c%s $APK) bytes"
        id: apk

      - name: Find AAB
        run: |
          AAB=$(find android -name "*.aab" -type f | head -1)
          echo "aab_path=$AAB" >> $GITHUB_OUTPUT
          echo "aab_name=$(basename $AAB)" >> $GITHUB_OUTPUT
          echo "AAB size: $(stat -c%s $AAB) bytes"
        id: aab

      - name: Verify build artifacts
        run: |
          echo "APK: ${{ steps.apk.outputs.apk_path }}"
          echo "AAB: ${{ steps.aab.outputs.aab_path }}"
          test -f "${{ steps.apk.outputs.apk_path }}" || { echo "APK not found"; exit 1; }
          test -f "${{ steps.aab.outputs.aab_path }}" || { echo "AAB not found"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: ConstAI v1.1.${{ github.run_number }}
          body: |
            ## ConstAI Field Console v1.1.${{ github.run_number }}

            Mobile field app for ConstAI — predictive construction management.
            Built with bare React Native (Expo removed) for minimal size.

            **Install on Android:**
            Download and open the APK file on your device.
            *Note: Signed with debug keystore — enable "Install from unknown sources" in settings.*

            **Features:**
            - Email & SMS OTP login
            - Biometric authentication
            - Offline project management (SQLite)
            - Background sync engine
            - Photo & document capture
          files: |
            ${{ steps.apk.outputs.apk_path }}
            ${{ steps.aab.outputs.aab_path }}
          fail_on_unmatched_files: false
